<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/masjidyussuf-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Prayer times, announcements, events and more for Masjid Yussuf.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masjid Yussuf">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masjid Yussuf</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Live compass for the website version (Qibla screen).
    window.masjidCompass = {
      start: function (cb) {
        function handler(e) {
          var h = null;
          if (typeof e.webkitCompassHeading === 'number') {
            h = e.webkitCompassHeading;            // iPhone
          } else if (e.absolute === true && typeof e.alpha === 'number') {
            h = (360 - e.alpha) % 360;             // Android
          }
          if (h !== null && !isNaN(h)) cb(h);
        }
        function attach() {
          window.addEventListener('deviceorientationabsolute', handler, true);
          window.addEventListener('deviceorientation', handler, true);
        }
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          return DeviceOrientationEvent.requestPermission()
            .then(function (r) { if (r === 'granted') { attach(); return true; } return false; })
            .catch(function () { return false; });
        }
        attach();
        return Promise.resolve(true);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
